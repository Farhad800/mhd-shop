<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0b0a08">
<title>MHD | مركز أدوات المطبخ</title><link rel="icon" href="img/mark.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MHD"><meta name="application-name" content="MHD">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a08;--card:#15130f;--ink:#f4ecd8;--mute:#a79c84;--gold:#d4af5f;--gold2:#a8802f;--line:#2b261c;--grad:linear-gradient(135deg,#e6c872,#b08a34);color-scheme:dark}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:17px;line-height:1.65;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Reem Kufi',Tajawal,sans-serif;line-height:1.3}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:20;background:rgba(11,10,8,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Reem Kufi',sans-serif;font-size:22px;color:var(--gold);letter-spacing:1px}
.brand img{height:38px;width:auto;display:block}
.lang{display:flex;gap:6px}.lang button{background:none;border:1px solid var(--line);border-radius:18px;padding:2px 11px;font-size:14px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--grad);border-color:transparent;color:#17120a;font-weight:700}
.hero{text-align:center;padding:26px 0 30px;background:radial-gradient(ellipse 70% 60% at 50% 38%,rgba(212,175,95,.16),transparent 70%)}
.hero img{width:min(380px,82%);height:auto;display:block;margin:0 auto;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.hero h1{font-size:clamp(26px,6.5vw,38px);color:var(--gold);margin-top:4px}
.hero p{color:var(--mute);max-width:34ch;margin:8px auto 0}
.cta{display:inline-block;margin-top:20px;background:var(--grad);color:#17120a;font-weight:700;padding:12px 32px;border-radius:12px;font-size:18px}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
h2.sec{font-size:30px;margin:26px 0 4px}h2.sec::after{content:"";display:block;width:50px;height:3px;border-radius:2px;background:var(--grad);margin-top:8px}
.sub{color:var(--mute);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.p .im{aspect-ratio:4/5;background:#fff;position:relative;overflow:hidden}
.p .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.p .im.ct img{object-fit:contain}.p .im.dk{background:#14120e}
.p .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.p h3{font-size:16px;line-height:1.4}.p .d{color:var(--mute);font-size:15px;flex:1}
.price{font-size:19px;font-weight:700;color:var(--gold)}.price small{font-size:14px;color:var(--mute);margin-inline-start:4px;font-weight:400}
.add{margin-top:6px;border:0;background:var(--grad);color:#17120a;font-weight:700;border-radius:12px;padding:11px;font-size:17px}
.qty{margin-top:6px;display:flex;align-items:center;justify-content:space-between;background:#1d1a13;border:1px solid var(--gold2);border-radius:12px;padding:4px}
.qty button{width:42px;height:38px;border:0;background:#2a2417;border-radius:9px;font-size:22px;color:var(--gold)}
.qty span{font-weight:700;font-size:19px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 16px;padding-bottom:2px;scrollbar-width:none}.chip{flex:none;background:#1d1a13;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 18px;font-size:16px}.chip[aria-pressed=true]{background:var(--grad);color:#17120a;border-color:transparent;font-weight:700}
.sh{grid-column:1/-1;font-size:24px;color:var(--gold);margin:14px 0 0}
.info{margin:34px 0 0;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--mute)}
.info b{color:var(--ink)}
.soc{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;direction:ltr}
.soc a{border-bottom:1px solid var(--gold2);color:var(--ink);padding-bottom:2px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:26px 0 8px;direction:ltr}
.bar{position:fixed;inset:auto 0 0 0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,10,8,.96);border-top:1px solid var(--gold2);display:none}
.bar.on{display:block}
.bar button{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;margin:0 auto;border:0;background:var(--grad);color:#17120a;font-weight:700;font-size:18px;padding:13px 18px;border-radius:14px}
.sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.66)}.sheet.on{display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:#12100c;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center}.ph h2{font-size:26px;color:var(--gold)}
.x{background:none;border:1px solid var(--line);width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--mute)}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it img{width:62px;height:62px;border-radius:10px;object-fit:cover;background:#fff;flex:none}
.it .n{flex:1;min-width:0}.it .n b{display:block;font-size:16px;line-height:1.35}.it .n span{color:var(--gold);font-size:15px}
.it .qty{margin:0;padding:2px;min-width:112px}.it .qty button{width:32px;height:32px;font-size:18px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:16px 0}.tot span:last-child{color:var(--gold)}
label{display:block;margin-top:10px;font-size:15px;color:var(--mute)}
input,textarea{width:100%;margin-top:4px;background:#0b0a08;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
textarea{min-height:76px;resize:vertical}
.send{margin-top:18px;width:100%;border:0;background:#1f8f4a;color:#fff;font-weight:700;font-size:19px;padding:14px;border-radius:14px}
.err{color:#ff9a8a;font-size:15px;margin-top:8px;min-height:22px}
.note{color:var(--mute);font-size:14px;margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}.map{margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:#14120e}.map iframe{width:100%;height:100%;border:0;display:block}.mapb{display:inline-block;margin-top:12px;background:var(--grad);color:#17120a;font-weight:700;padding:10px 22px;border-radius:12px}
@font-face{font-family:Rudaw;src:url(fonts/rudaw-regular.woff) format('woff');font-display:swap}
html[lang=ku] body,html[lang=ku] h1,html[lang=ku] h2,html[lang=ku] h3,html[lang=ku] button,html[lang=ku] input,html[lang=ku] textarea{font-family:Rudaw,Tajawal,Tahoma,sans-serif}
.inst{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;z-index:35;max-width:520px;margin:0 auto;display:none;align-items:center;gap:12px;background:#15130f;border:1px solid var(--gold2);border-radius:18px;padding:12px 14px;box-shadow:0 16px 40px -10px rgba(0,0,0,.7)}
.inst.on{display:flex}.inst img{width:44px;height:44px;border-radius:11px;flex:none}.inst p{flex:1;margin:0;font-size:14.5px;line-height:1.45;color:var(--mute)}.inst p b{display:block;font-size:15.5px;color:var(--ink)}
.inst .ib{border:0;background:var(--grad);color:#17120a;font-weight:700;border-radius:12px;padding:9px 16px;flex:none}.inst .x{background:none;border:0;color:var(--mute);font-size:20px;padding:4px;flex:none}.inst [hidden]{display:none!important}
body:has(.bar.on) .inst{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><img src="img/mark.png" alt=""><span>MHD</span></div>
<div class="lang"><button data-l="ar">عربي</button><button data-l="ku">کوردی</button><button data-l="en">EN</button></div></div></header>
<section class="hero"><img src="img/logo.png" alt="MHD"><h1 data-k="tag"></h1><p data-k="sub"></p><a class="cta" href="#shop" data-k="shop"></a></section>
<main class="wrap" id="shop"><h2 class="sec" data-k="pt"></h2><p class="sub" data-k="ps"></p><div class="chips" id="chips"></div><div class="grid" id="grid"></div>
<section class="info"><p><b data-k="ih"></b></p><p data-k="ib"></p><div class="soc"><a target="_blank" rel="noopener" href="https://www.instagram.com/almas_center0">Instagram @almas_center0</a><a target="_blank" rel="noopener" href="https://www.tiktok.com/@almascenter_">TikTok @almascenter_</a></div></section><section class="info" id="loc"><p><b data-k="loc"></b></p><p data-k="loca"></p><div class="map"><iframe title="MHD location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=36.79409,42.91606&amp;z=16&amp;output=embed"></iframe></div><a class="mapb" target="_blank" rel="noopener" href="https://maps.app.goo.gl/1FmeNpgFmibuHCeM8" data-k="locb"></a></section></main>
<footer>© MHD</footer>
<div class="bar" id="bar"><button id="openCart"><span id="bn"></span><span id="bt"></span></button></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="ct"><div class="panel">
<div class="ph"><h2 id="ct" data-k="cart"></h2><button class="x" id="close" aria-label="close">✕</button></div>
<div id="items"></div>
<div id="co"><div class="tot"><span data-k="total"></span><span id="tv"></span></div>
<label for="nm" data-k="name"></label><input id="nm" autocomplete="name">
<label for="ph" data-k="phone"></label><input id="ph" type="tel" inputmode="tel" autocomplete="tel">
<label for="ad" data-k="addr"></label><textarea id="ad" autocomplete="street-address"></textarea>
<label for="nt" data-k="notes"></label><input id="nt">
<p class="err" id="err" role="alert"></p>
<button class="send" id="send" data-k="send"></button><p class="note" data-k="note"></p></div></div></div>
<div class="inst" id="inst" role="dialog" aria-labelledby="ih"><img src="img/icon-192.png" alt=""><p><b id="ih" data-k="ih2"></b><span id="itx"></span></p><button class="ib" id="ib" data-k="ib" hidden></button><button class="x" id="ix" aria-label="close">✕</button></div>
<script src="js/a0.js"></script><script src="js/p0.js"></script><script src="js/p1.js"></script><script src="js/p2.js"></script><script src="js/t.js"></script><script src="js/s.js"></script><script src="js/p3.js"></script><script src="js/app.js"></script></body></html>
